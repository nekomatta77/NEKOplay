<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Фейковые новости</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <h1>Срочные новости</h1>
        <div class="live-badge" style="display: flex; align-items: center; gap: 6px;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                <circle cx="12" cy="12" r="10"></circle>
            </svg>
            LIVE
        </div>
    </div>

    <div class="content" id="app-content">
        <div class="news-card">
            <p>Подключение к студии...</p>
        </div>
    </div>

    <div class="ticker">
        <div class="ticker-text" id="ticker-text">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: text-bottom; margin: 0 4px;">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
            ЭКСТРЕННОЕ СООБЩЕНИЕ: Игроки подключаются к студии... 
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: text-bottom; margin: 0 4px; margin-left: 15px;">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
            ШОК-КОНТЕНТ: Кто-то придумывает коварную ложь прямо сейчас...
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
