<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neon Tic-Tac-Toe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glow-bg" id="glow"></div>

  <button class="leave-btn" onclick="leaveGame()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
      <polyline points="16 17 21 12 16 7"></polyline>
      <line x1="21" y1="12" x2="9" y2="12"></line>
    </svg>
    Выйти
  </button>

  <button class="help-btn" onclick="toggleHelp()">?</button>

  <div class="header">
    <h1>NEKO<span style="color: var(--my-color)">TicTac</span></h1>
    <div class="status" id="status">Жми на поле!</div>
  </div>

  <div class="board-container">
    <div class="board" id="board"></div>
  </div>

  <div class="cooldown-bar">
    <div class="cooldown-fill" id="cooldown"></div>
  </div>

  <div class="overlay active" id="countdownOverlay" style="z-index: 200;">
    <div class="countdown-text" id="countdownText">ОЖИДАНИЕ...</div>
  </div>

  <div class="overlay" id="helpOverlay">
    <div class="modal">
      <h2>Как играть?</h2>
      <p id="rulesDescription"></p>
      <h3 style="color: white; margin-top: 15px; margin-bottom: 5px; font-size: 1rem;">Правила комнаты:</h3>
      <ul id="dynamicRules"></ul>
      <button class="close-btn" onclick="toggleHelp()">Понятно, в бой!</button>
    </div>
  </div>

  <div class="overlay" id="winnerOverlay">
    <div class="modal" style="text-align: center; border-color: var(--my-color); box-shadow: 0 0 40px rgba(0,0,0,0.8);">
      <div class="winner-text" id="winnerText" style="font-size: 2rem; margin-bottom: 20px;">ИГРА ОКОНЧЕНА</div>
      <button class="restart-btn" onclick="requestRestart()">Играть еще раз</button>
    </div>
  </div>

  <script src="rules.js"></script>
  <script src="game.js"></script>
</body>
</html>
