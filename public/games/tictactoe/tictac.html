<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neon Tic-Tac-Toe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glow-bg" id="glow"></div>

  <button class="leave-btn" onclick="leaveGame()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
      <polyline points="16 17 21 12 16 7"></polyline>
      <line x1="21" y1="12" x2="9" y2="12"></line>
    </svg>
    ВЫЙТИ
  </button>

  <div class="header">
    <h1>Крестики-Нолики</h1>
    <div class="status" id="status">Матч смерти</div>
  </div>

  <div class="board-container">
    <div class="board" id="board"></div>
  </div>

  <div class="cooldown-bar">
    <div class="cooldown-fill" id="cooldown"></div>
  </div>

  <div class="overlay" id="countdownOverlay">
    <div class="countdown-text" id="countdownText">3</div>
  </div>

  <div class="overlay" id="winnerOverlay">
    <div class="winner-text" id="winnerText">ПОБЕДА!</div>
    <button class="restart-btn" id="restartBtn">ИГРАТЬ ЕЩЕ РАЗ</button>
  </div>

  <script src="rules.js"></script>
  <script src="game.js"></script>
</body>
</html>
