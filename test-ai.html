<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест API Бункера</title>
    <style>
        body { background-color: #12141c; color: #ffffff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 50px; }
        .btn { background-color: #00ff88; color: #000; padding: 15px 30px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .btn:hover { background-color: #00cc6a; }
        #result { margin-top: 30px; padding: 20px; background: #1a1d29; border: 1px solid #333; border-radius: 8px; width: 100%; max-width: 600px; min-height: 150px; white-space: pre-wrap; line-height: 1.5; color: #00ff88;}
        .error { color: #ff4444 !important; }
    </style>
</head>
<body>
    <h2>Изолированный тест нейросети</h2>
    <button class="btn" id="testBtn">Сгенерировать тестовый ответ</button>
    <div id="result">Нажмите кнопку для отправки запроса к /api/generate...</div>

    <script>
        document.getElementById('testBtn').addEventListener('click', async () => {
            const resultDiv = document.getElementById('result');
            resultDiv.className = '';
            resultDiv.innerText = "Подключение к /api/generate...\n\nЕсли запрос выдаст 404, убедитесь, что вы открыли этот файл по ссылке Vercel, а не на локальном компьютере.";
            
            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'google/gemma-2-9b-it:free',
                        messages: [{ role: 'user', content: 'Опиши заброшенный бункер одним коротким и мрачным предложением.' }],
                        max_tokens: 200,
                        temperature: 0.8,
                        stream: true
                    })
                });

                if (!response.ok) {
                    const errText = await response.text();
                    resultDiv.className = 'error';
                    resultDiv.innerText = `Ошибка ${response.status}: ${errText}\n\nКод 404 означает, что серверная функция не найдена (вы тестируете локально или папка api не загружена).`;
                    return;
                }

                resultDiv.innerText = "";
                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        const trimmedLine = line.trim();
                        if (trimmedLine.startsWith('data: ') && trimmedLine !== 'data: [DONE]') {
                            try {
                                const data = JSON.parse(trimmedLine.slice(6));
                                if (data.choices && data.choices[0].delta && data.choices[0].delta.content) {
                                    resultDiv.innerText += data.choices[0].delta.content;
                                }
                            } catch(e) {}
                        }
                    }
                }
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.innerText = `Критическая ошибка: ${error.message}`;
            }
        });
    </script>
</body>
</html>
